<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f5f0"/>

  <!-- Giant faint wordmark, echoes the footer's closing visual -->
  <text x="-20" y="590" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="340" fill="#0d0d0c" fill-opacity="0.05" letter-spacing="4">BRIXA</text>

  <!-- Logo mark -->
  <circle cx="150" cy="150" r="56" fill="#24399e"/>
  <text x="150" y="172" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="56" fill="#f7f5f0" text-anchor="middle">B</text>

  <!-- Wordmark -->
  <text x="230" y="172" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="64" fill="#0d0d0c" letter-spacing="-1">Brixa</text>

  <!-- Tagline -->
  <text x="150" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="600"
        font-size="40" fill="#0d0d0c" fill-opacity="0.75">
    <tspan x="150" dy="0">Website &amp; aplikasi,</tspan>
    <tspan x="150" dy="52">dirancang dengan presisi.</tspan>
  </text>
</svg>
